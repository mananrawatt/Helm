replicaCount: 2

image:
  repository: login
  tag: v2
  pullPolicy: IfNotPresent

container:
  port: 8086

service:
  type: ClusterIP
  port: 80

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10