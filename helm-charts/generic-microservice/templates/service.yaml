apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.serviceName }}
  labels:
    app: {{ .Values.serviceName }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ .Values.serviceName }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
