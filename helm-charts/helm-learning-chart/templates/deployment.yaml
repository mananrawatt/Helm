apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-helm-learning-app
  labels:
    app: helm-learning-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: helm-learning-app

  template:
    metadata:
      labels:
        app: helm-learning-app

    spec:
      containers:
        - name: helm-learning-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10