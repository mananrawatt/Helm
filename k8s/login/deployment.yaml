apiVersion: apps/v1
kind: Deployment

metadata:
  name: login-app
  labels:
    app: login-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: login-app

  template:
    metadata:
      labels:
        app: login-app

    spec:
      containers:
        - name: login-app
          image: login:v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8086
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
